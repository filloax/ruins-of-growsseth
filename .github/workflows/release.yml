name: Release Mod (1.21.1)

on:
  push:
    branches:
      - 'release/1.21.1'
env:
  JAVA_VERSION: 21
  MC_VER: 1.21.1           # Main version
  MC_VER_EXTRA: 1.21.1     # Minor releases that are still compatible

jobs:
  build:
    # 'chore: release' commits will trigger the build
    if: "contains(github.event.head_commit.message, 'chore: release') && github.event_name != 'pull_request'"
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.get_version.outputs.MOD_VERSION }}
      version_type: ${{ steps.get_version.outputs.VERSION_TYPE }}
      version_suffix: ${{ steps.get_version.outputs.VERSION_SUFFIX }}
      release_tag: ${{ steps.get_version.outputs.RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Needed to check tags

      - name: Extract version info from gradle.properties
        id: get_version
        run: |
          MOD_VERSION=$(grep "modVersion" gradle.properties | cut -d'=' -f2 | xargs)
          VERSION_TYPE=$(grep "versionType" gradle.properties | cut -d'=' -f2 | xargs)

          if [ -n "$VERSION_TYPE" ]; then
            VERSION_SUFFIX="-${VERSION_TYPE}"
          else
            VERSION_SUFFIX=""
          fi
          
          RELEASE_TAG=v${MOD_VERSION}${VERSION_SUFFIX}-${{ env.MC_VER }}

          echo "MOD_VERSION=${MOD_VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_TYPE=${VERSION_TYPE}" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=${VERSION_SUFFIX}" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Check if Tag already exists
        id: check_tag
        run: |
          TAG=${{ steps.get_version.outputs.RELEASE_TAG }}
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists! Preventing override"
            exit 1
          else
            echo "Tag ${TAG} does not exist in current releases, will proceed"
          fi

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -PreplaceTokens=true
        env:
          GROWSSETH_MUSIC_PW: ${{ secrets.MUSIC_PW }}

      - name: Extract latest changelog
        id: changelog
        run: |
          latest_version=$(grep -m 1 -oP '(?<=##\s)\d+\.\d+\.\d+' CHANGELOG.md)
          latest_changelog=$(sed -n "/## $latest_version/,/## /p" CHANGELOG.md | sed '$d')
          echo "$latest_changelog" > latest_changelog.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            base/build/libs/*.jar
            base/build/datapack/*.zip
            latest_changelog.txt
          retention-days: 30

  publish_platform:
    name: Publish (Platforms)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: neoforge
            name: Neoforge
            dependencies: |
              resourceful-config(required)
              kotlin-for-forge(required)
          - platform: fabric
            name: Fabric
            dependencies: |
              resourceful-config(required)
              fabric-language-kotlin(required)
              fabric-api(required)
              modmenu(recommended)
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        id: mc_publish
        with:
          modrinth-token: ${{ secrets.TOKEN_MODRINTH }}
          modrinth-id: 476XCS3C
          curseforge-token: ${{ secrets.TOKEN_CURSEFORGE }}
          curseforge-id: 1017555

          name: Ruins of Growsseth ${{ needs.build.outputs.mod_version }}${{ needs.build.outputs.version_suffix }} for ${{ matrix.name }} + Minecraft ${{ env.MC_VER }}
          version: ${{ needs.build.outputs.mod_version }}-${{ env.MC_VER }}${{ needs.build.outputs.version_suffix }}-${{ matrix.platform }}
          version-type: ${{ needs.build.outputs.version_type }}

          files: |
            ${{ matrix.platform }}/build/libs/!(*-@(dev|sources|javadoc)).jar
            ${{ matrix.platform }}/build/libs/*-@(dev|sources|javadocs).jar
          game-versions: |
            ${{ env.MC_VER }}
            ${{ env.MC_VER_EXTRA }}
          dependencies: ${{ matrix.dependencies }}
          java: 21
          loaders: ${{ matrix.platform }}

          changelog-file: latest_changelog.txt

      - run: echo "Published ${{ matrix.name }}!"

  publish_github:
    name: Publish (GitHub)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Publish (GitHub)
        uses: softprops/action-gh-release@v2
        with:
          name: Ruins of Growsseth ${{ needs.build.outputs.mod_version }}${{ needs.build.outputs.version_suffix }} for Minecraft ${{ env.MC_VER }}
          body_path: latest_changelog.txt
          token: ${{ secrets.TOKEN_GITHUB }}
          make_latest: true
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ env.GITHUB_SHA }}
          files: |
            base/build/libs/*.jar
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar
            base/build/datapack/*.zip